services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: jokkolive_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: jokkolive
    volumes:
      - mongo_data:/data/db

  # ── WAHA — WhatsApp HTTP API ────────────────────────────────────────────────
  # UI / scan QR : http://<host>:3001 (à configurer une seule fois après boot)
  waha:
    image: devlikeapro/waha:latest
    container_name: jokkolive_waha
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Protège l'API WAHA — l'API NestJS doit envoyer ce header X-Api-Key
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # Basic Auth du Swagger / dashboard (port 3001)
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USER:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USER:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      # WAHA appelle ce webhook pour chaque message reçu. WAHA Core ne signe
      # pas en HMAC : on passe un token secret en query string que l'API vérifie.
      WHATSAPP_HOOK_URL: http://api:3000/webhooks/whatsapp/message?token=${WAHA_WEBHOOK_TOKEN}
      WHATSAPP_HOOK_EVENTS: message
    volumes:
      - waha_data:/app/.sessions

  # ── API NestJS ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jokkolive_api
    restart: unless-stopped
    depends_on:
      - mongodb
      - waha
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/jokkolive?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_WEBHOOK_TOKEN: ${WAHA_WEBHOOK_TOKEN}
      ADMIN_PHONE: ${ADMIN_PHONE:-+221776583181}
      ADMIN_PSEUDO: ${ADMIN_PSEUDO:-admin}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-+221776583181}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://jokkolive.com}
      # ── PSP DiamanoPay ──────────────────────────────────────────────────
      DIAMANO_PAY_TOKEN: ${DIAMANO_PAY_TOKEN:-}
      DIAMANO_PAY_BASE_URL: ${DIAMANO_PAY_BASE_URL:-https://api.diamanopay.com}
      ACTIVE_PSP: ${ACTIVE_PSP:-diamanopay}
      PLATFORM_FEE_FLAT: ${PLATFORM_FEE_FLAT:-50}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-0.02}

  # ── Dashboard (React + Nginx) ───────────────────────────────────────────────
  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: jokkolive_dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongo_data:
  waha_data:
